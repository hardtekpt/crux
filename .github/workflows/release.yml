# Every push to main runs the device tests, builds a signed release APK, checks its signing key
# and publishes it as a GitHub release (APK, its SHA-256 and the R8 mapping).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate. Phones refuse an update signed with any other
  # key, so a release that doesn't match is never published. (Public: any copy of the APK shows it.)
  CRUX_CERT_SHA256: a28e87817c000b9f3c8dd2429803605e2d78f76eaf9c7c6356676bfe2b3ccc36

jobs:
  device-tests:
    uses: ./.github/workflows/device-tests.yml

  release:
    needs: device-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: |
          name=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="v$name"
          prerelease=false
          # A tag on this very commit is this release. A tag elsewhere means main moved without a
          # version bump: publish a numbered prerelease instead of clobbering the tag.
          tagged=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            tag="$tag-build.$GITHUB_RUN_NUMBER"
            prerelease=true
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # The changelog for this versionCode is the release notes here and on F-Droid.
      - name: Release notes
        id: notes
        run: |
          IFS=. read -r major minor patch <<< "${{ steps.version.outputs.name }}"
          file="fastlane/metadata/android/en-US/changelogs/$((major * 10000 + minor * 100 + patch)).txt"
          if [ ! -f "$file" ]; then
            echo "::error::$file is missing. Add what changed in this release (500 characters at most); see CLAUDE.md."
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CRUX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret CRUX_KEYSTORE_BASE64 is not set; see CLAUDE.md (Releases)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CRUX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Format, test, lint
        run: ./gradlew spotlessCheck verifyRoborazziDebug lintDebug

      - name: Build release APK
        env:
          CRUX_KEYSTORE_PASSWORD: ${{ secrets.CRUX_KEYSTORE_PASSWORD }}
          CRUX_KEY_ALIAS: ${{ secrets.CRUX_KEY_ALIAS }}
          CRUX_KEY_PASSWORD: ${{ secrets.CRUX_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "crux-${{ steps.version.outputs.tag }}.apk"
          # R8 mapping, to read stack traces from this release.
          cp app/build/outputs/mapping/release/mapping.txt "crux-${{ steps.version.outputs.tag }}-mapping.txt"

      - name: Verify signature
        run: |
          apk="crux-${{ steps.version.outputs.tag }}.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$actual" != "$CRUX_CERT_SHA256" ]; then
            echo "::error::$apk is signed with $actual, expected $CRUX_CERT_SHA256."
            exit 1
          fi
          sha256sum "$apk" > "$apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "Crux ${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" --notes-file "${{ steps.notes.outputs.file }}" --generate-notes)
          if [ "${{ steps.version.outputs.prerelease }}" = true ]; then flags+=(--prerelease); fi
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" "crux-$tag.apk" "crux-$tag.apk.sha256" "crux-$tag-mapping.txt" "${flags[@]}"
