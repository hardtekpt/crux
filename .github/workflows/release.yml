# Every push to main builds a signed release APK and publishes it as a GitHub release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Read version
        id: version
        run: |
          name=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="v$name"
          prerelease=false
          # main moved without a version bump: publish a numbered prerelease instead of clobbering the tag.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag="$tag-build.$GITHUB_RUN_NUMBER"
            prerelease=true
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CRUX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret CRUX_KEYSTORE_BASE64 is not set; see CLAUDE.md (Releases)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CRUX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        env:
          CRUX_KEYSTORE_PASSWORD: ${{ secrets.CRUX_KEYSTORE_PASSWORD }}
          CRUX_KEY_ALIAS: ${{ secrets.CRUX_KEY_ALIAS }}
          CRUX_KEY_PASSWORD: ${{ secrets.CRUX_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "crux-${{ steps.version.outputs.tag }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "Crux ${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes)
          if [ "${{ steps.version.outputs.prerelease }}" = true ]; then flags+=(--prerelease); fi
          gh release create "${{ steps.version.outputs.tag }}" "crux-${{ steps.version.outputs.tag }}.apk" "${flags[@]}"
