# Pushes to dev (and PRs into main) check formatting, run the unit and screenshot tests and Android Lint,
# and make sure a release build still compiles. A newer push to the same branch cancels this run.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Format, test, lint
        run: ./gradlew spotlessCheck verifyRoborazziDebug lintDebug koverXmlReportDebug koverLogDebug

      - name: Build release APK (debug-signed)
        run: ./gradlew assembleRelease

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: app/build/reports/kover/
          if-no-files-found: ignore

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/outputs/roborazzi/
            app/build/reports/lint-results-*.html
            build/reports/problems/
          if-no-files-found: ignore
