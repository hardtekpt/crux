# Instrumented tests (Room migrations, DAOs, Compose UI with Hilt) on an emulator.
# Runs on PRs into main, by hand, and before every release (release.yml calls it).
# Not on every dev push: an emulator run takes ~15 minutes of the Actions allowance.
name: Device tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
