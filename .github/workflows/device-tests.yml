# Instrumented tests (Room migrations, DAOs, Compose UI with Hilt) on an emulator.
# Runs on PRs into main, by hand, before every release (release.yml calls it), and on pushes to
# ci/* branches (git push origin HEAD:ci/device-tests) for a run from any commit.
# Not on every dev push: an emulator run takes ~15 minutes of the Actions allowance.
name: Device tests

on:
  push:
    branches: ['ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # The emulator's data partition needs several GB; the runner image ships toolchains we don't use.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules && df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app, test and release APKs
        # Then stop Gradle's and Kotlin's daemons: the runner has ~7 GB, and the emulator needs its share.
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # A real phone screen; the default AVD is 320×640, too small for the dashboard drag test.
          profile: pixel_6
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Instrumented tests on the debug build, then a launch check of the minified release build.
          script: |
            ./gradlew connectedDebugAndroidTest
            ./scripts/release-smoke.sh

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
